<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">MaruCheck — test what your AI didn’t</title>
<desc id="desc">Flagship open-source project. A terminal replays MaruCheck blocking an AI-written change: the test suite is green, but maru verify --diff finds the change violates the approved Quality Contract and blocks it.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:Arial,Helvetica,'Liberation Sans',sans-serif}
.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:0 50%}
.fbt{transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes roll{from{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:-200}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}@keyframes l0{0%,4%{opacity:0}4.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes c0{0%,4.5%{transform:translateX(82px)}4.6%{transform:translateX(0);animation-timing-function:steps(10,end)}12%,100%{transform:translateX(82px)}}
@keyframes k0{0%,4%{opacity:0}4.5%,15%{opacity:1}15.5%,100%{opacity:0}}
@keyframes l1{0%,13%{opacity:0}13.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes l2{0%,17%{opacity:0}17.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes l3{0%,24%{opacity:0}24.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes c3{0%,24.5%{transform:translateX(160px)}24.6%{transform:translateX(0);animation-timing-function:steps(20,end)}32%,100%{transform:translateX(160px)}}
@keyframes k3{0%,24%{opacity:0}24.5%,35%{opacity:1}35.5%,100%{opacity:0}}
@keyframes l4{0%,38%{opacity:0}38.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes l5{0%,43%{opacity:0}43.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes l6{0%,49%{opacity:0}49.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes l7{0%,53%{opacity:0}53.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes l8{0%,57%{opacity:0}57.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes l9{0%,64%{opacity:0}64.5%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes stamp{0%,43%{opacity:0;transform:scale(1.6)}44.5%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
.stamp{animation:stamp 14s cubic-bezier(.16,1,.3,1) infinite}</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="438" rx="26"/></clipPath>
<radialGradient id="mglow" cx=".5" cy=".5" r=".5"><stop stop-color="#D7FF3F" stop-opacity="0.128"/><stop offset="1" stop-color="#D7FF3F" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="440" fill="#080808"/>
<rect width="1200" height="440" fill="url(#grid)"/>

<rect x="760" y="-80" width="560" height="560" fill="url(#mglow)"/>
<g style="animation:fade 0.8s cubic-bezier(.16,1,.3,1) 0s backwards">
<text x="48" y="58" class="mono" font-size="11" letter-spacing="1.8" fill="#D7FF3F" fill-opacity="1" text-anchor="start" style="">00 / FLAGSHIP · OPEN SOURCE · NPM v0.5.0</text>
</g>
<g style="animation:rise 1s cubic-bezier(.16,1,.3,1) 0.1s backwards"><text x="46" y="128" class="sans" font-size="60" font-weight="800" letter-spacing="-2.4" fill="#F0EDE8">MaruCheck</text></g>
<g style="animation:rise 1s cubic-bezier(.16,1,.3,1) 0.2s backwards"><text x="48" y="174" class="serif" font-size="32" letter-spacing="-.6" fill="#D7FF3F">Test what your AI didn’t.</text></g>
<g class="sans" font-size="16" fill="#A3A3A3" style="animation:rise 1s cubic-bezier(.16,1,.3,1) 0.35s backwards">
<text x="48" y="220">Independent QA for AI-generated software. Verifies agent</text>
<text x="48" y="244">changes against a human-owned Quality Contract the agent</text>
<text x="48" y="268">can’t edit. Local-first: no account, no API key, no upload.</text>
</g>
<g style="animation:rise 0.7s cubic-bezier(.16,1,.3,1) 0.7s backwards">
<rect x="48" y="312" width="96" height="28" rx="14" fill="#161616" stroke="#FFFFFF" stroke-opacity="0.1"/>
<text x="60" y="330.32" class="mono" font-size="12" fill="#F0EDE8" fill-opacity="0.86">TypeScript</text>
</g>
<g style="animation:rise 0.7s cubic-bezier(.16,1,.3,1) 0.8s backwards">
<rect x="152" y="312" width="74.4" height="28" rx="14" fill="#161616" stroke="#FFFFFF" stroke-opacity="0.1"/>
<text x="164" y="330.32" class="mono" font-size="12" fill="#F0EDE8" fill-opacity="0.86">Node 24</text>
</g>
<g style="animation:rise 0.7s cubic-bezier(.16,1,.3,1) 0.8s backwards">
<rect x="234.4" y="312" width="45.6" height="28" rx="14" fill="#161616" stroke="#FFFFFF" stroke-opacity="0.1"/>
<text x="246.4" y="330.32" class="mono" font-size="12" fill="#F0EDE8" fill-opacity="0.86">CLI</text>
</g>
<g style="animation:rise 0.7s cubic-bezier(.16,1,.3,1) 0.9s backwards">
<rect x="288" y="312" width="96" height="28" rx="14" fill="#161616" stroke="#FFFFFF" stroke-opacity="0.1"/>
<text x="300" y="330.32" class="mono" font-size="12" fill="#F0EDE8" fill-opacity="0.86">MCP server</text>
</g>
<g style="animation:rise 0.7s cubic-bezier(.16,1,.3,1) 0.9s backwards">
<rect x="392" y="312" width="96" height="28" rx="14" fill="#161616" stroke="#FFFFFF" stroke-opacity="0.1"/>
<text x="404" y="330.32" class="mono" font-size="12" fill="#F0EDE8" fill-opacity="0.86">Playwright</text>
</g>
<g style="animation:rise 0.7s cubic-bezier(.16,1,.3,1) 1s backwards">
<rect x="48" y="348" width="124.8" height="28" rx="14" fill="#161616" stroke="#FFFFFF" stroke-opacity="0.1"/>
<text x="60" y="366.32" class="mono" font-size="12" fill="#F0EDE8" fill-opacity="0.86">GitHub Actions</text>
</g>
<g style="animation:fade 1s cubic-bezier(.16,1,.3,1) 0.9s backwards"><text x="48" y="404" class="mono" font-size="10" letter-spacing="1.4" fill="#666666" fill-opacity="1" text-anchor="start" style="">RUNS AS A CLI, A CI GATE, AND A CLAUDE CODE STOP HOOK</text></g>

<g style="animation:rise 1.1s cubic-bezier(.16,1,.3,1) 0.25s backwards">
<rect x="612" y="44" width="548" height="352" rx="16" fill="#0F0F0F" stroke="#FFFFFF" stroke-opacity="0.14"/>
<path d="M612 84H1160" stroke="#FFFFFF" stroke-opacity="0.1"/>
<circle cx="634" cy="64" r="5" fill="#FF6B57" fill-opacity=".85"/>
<circle cx="652" cy="64" r="5" fill="#FFC01E" fill-opacity=".85"/>
<circle cx="670" cy="64" r="5" fill="#D7FF3F" fill-opacity=".85"/>
<text x="886" y="68" class="mono" font-size="11" letter-spacing="0.6" fill="#666666" fill-opacity="1" text-anchor="middle" style="">examples/quota-app — maru</text>
<g style="animation:l0 14s linear infinite"><text x="636" y="118" class="mono" font-size="13" fill="#F0EDE8" font-weight="400" xml:space="preserve"><tspan fill="#D7FF3F">$</tspan><tspan fill="#F0EDE8"> npm test</tspan></text><g style="animation:c0 14s linear infinite;transform:translateX(82px)"><rect x="634" y="101" width="102" height="24" fill="#0F0F0F"/><rect x="636" y="105" width="8" height="17" fill="#D7FF3F" style="animation:k0 14s linear infinite;opacity:0"/></g></g>
<g style="animation:l1 14s linear infinite"><text x="636" y="142" class="mono" font-size="13" fill="#D7FF3F" font-weight="400" xml:space="preserve">      Tests  4 passed (4)</text></g>
<g style="animation:l2 14s linear infinite"><text x="636" y="166" class="mono" font-size="13" fill="#666666" font-weight="400" xml:space="preserve"># Green. The suite agrees with the code the agent wrote.</text></g>
<g style="animation:l3 14s linear infinite"><text x="636" y="190" class="mono" font-size="13" fill="#F0EDE8" font-weight="400" xml:space="preserve"><tspan fill="#D7FF3F">$</tspan><tspan fill="#F0EDE8"> maru verify --diff</tspan></text><g style="animation:c3 14s linear infinite;transform:translateX(160px)"><rect x="634" y="173" width="180" height="24" fill="#0F0F0F"/><rect x="636" y="177" width="8" height="17" fill="#D7FF3F" style="animation:k3 14s linear infinite;opacity:0"/></g></g>
<g style="animation:l4 14s linear infinite"><text x="636" y="214" class="mono" font-size="13" fill="#A3A3A3" font-weight="400" xml:space="preserve">Risk: MODERATE (30/100) · contract: usage-quota</text></g>
<g style="animation:l5 14s linear infinite"><text x="636" y="238" class="mono" font-size="13" fill="#FF6B57" font-weight="700" xml:space="preserve">Verification gate: BLOCKED</text></g>
<g style="animation:l6 14s linear infinite"><text x="636" y="262" class="mono" font-size="13" fill="#F0EDE8" font-weight="400" xml:space="preserve">[HIGH] BLOCKING  QUOTA-001 verification failed</text></g>
<g style="animation:l7 14s linear infinite"><text x="636" y="286" class="mono" font-size="13" fill="#A3A3A3" font-weight="400" xml:space="preserve">  Expected: at most 10 generations per month</text></g>
<g style="animation:l8 14s linear infinite"><text x="636" y="310" class="mono" font-size="13" fill="#FF6B57" font-weight="400" xml:space="preserve">  Actual:   Received: "pro"</text></g>
<g style="animation:l9 14s linear infinite"><text x="636" y="334" class="mono" font-size="13" fill="#666666" font-weight="400" xml:space="preserve"># The tests moved. The contract did not.</text></g>
<g class="stamp fb"><g transform="translate(1028 230)">
<rect width="108" height="30" rx="6" fill="#FF6B57" transform="rotate(-6 54 15)"/>
<text x="54" y="20" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" transform="rotate(-6 54 15)">BLOCKED</text>
</g></g>
</g>
</g>
<rect x="1" y="1" width="1198" height="438" rx="26" stroke="#FFFFFF" stroke-opacity="0.12000000000000001" stroke-width="2"/>
</svg>
