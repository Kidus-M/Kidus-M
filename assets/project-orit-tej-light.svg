<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Orit Tej — Mobile membership &amp; pickup ecosystem, end to end.</title>
<desc id="desc">Orit Tej: a phone scans a one-time pickup QR code while events stream in: membership renewed via recurring Stripe billing, inventory broadcast to all members, pickup verified.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:Arial,Helvetica,'Liberation Sans',sans-serif}
.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:0 50%}
.fbt{transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes roll{from{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:-200}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}@keyframes ev0{0%,6%{opacity:0;transform:translateX(24px)}12%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}@keyframes ev1{0%,30%{opacity:0;transform:translateX(24px)}36%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}@keyframes ev2{0%,58%{opacity:0;transform:translateX(24px)}64%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(61.6px)}}
.scan{animation:scan 2.6s ease-in-out infinite}</style>
