<rect x="24" y="72" width="552" height="200" rx="16" fill="#FAF8F3" stroke="#0A0A0A" stroke-opacity="0.12"/>

<text x="44" y="104" class="mono" font-size="9" letter-spacing="1.6" fill="#57544F" fill-opacity="1" text-anchor="start" style="">LIVE OPERATIONS</text>

<circle cx="160" cy="101" r="3" fill="#5F7D00" class="fb" style="animation:ping 2.4s cubic-bezier(.16,1,.3,1) 0s infinite"/>
