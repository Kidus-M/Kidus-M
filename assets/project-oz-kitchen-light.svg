<circle cx="372" cy="176" r="16" stroke="#5F7D00" class="fb" style="animation:ping 2.7s cubic-bezier(.16,1,.3,1) 1.3s infinite"/>
<text x="372" y="180" class="mono" font-size="10" font-weight="700" fill="#5F7D00" text-anchor="middle">03</text>
<text x="372" y="216" class="mono" font-size="9" letter-spacing="1.4" fill="#57544F" fill-opacity="1" text-anchor="middle" style="">DISPATCH</text>
