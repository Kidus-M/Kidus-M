<g style="animation:toast0 8s cubic-bezier(.16,1,.3,1) infinite"><rect x="382" y="88" width="174" height="26" rx="13" fill="#ECE8DE" stroke="#5F7D00" stroke-opacity=".5"/><text x="469" y="105" class="mono" font-size="10" fill="#0A0A0A" text-anchor="middle">TELEGRAM · rider assigned</text></g><g style="animation:toast1 8s cubic-bezier(.16,1,.3,1) infinite"><rect x="388" y="88" width="168" height="26" rx="13" fill="#ECE8DE" stroke="#5F7D00" stroke-opacity=".5"/><text x="472" y="105" class="mono" font-size="10" fill="#0A0A0A" text-anchor="middle">REALTIME · queue updated</text></g>
<text x="300" y="258" class="mono" font-size="9" letter-spacing="1.3" fill="#9C978D" fill-opacity="1" text-anchor="middle" style="">POSTGRES · ROW-LEVEL SECURITY · ONE SOURCE OF TRUTH</text>
</g>
<g style="animation:rise 0.9s cubic-bezier(.16,1,.3,1) 0.2s backwards"><text x="30" y="322" class="sans" font-size="34" font-weight="800" letter-spacing="-1.2" fill="#0A0A0A">Oz Kitchen</text></g>
<g style="animation:rise 0.9s cubic-bezier(.16,1,.3,1) 0.3s backwards"><text x="32" y="354" class="sans" font-size="16" fill="#57544F">One operational system, from order to delivery.</text></g>
