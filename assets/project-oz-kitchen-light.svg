<circle cx="518" cy="176" r="16" stroke="#5F7D00" class="fb" style="animation:ping 2.7s cubic-bezier(.16,1,.3,1) 0.7s infinite"/>
<text x="518" y="180" class="mono" font-size="10" font-weight="700" fill="#5F7D00" text-anchor="middle">04</text>
<text x="518" y="216" class="mono" font-size="9" letter-spacing="1.4" fill="#57544F" fill-opacity="1" text-anchor="middle" style="">DELIVERED</text>

