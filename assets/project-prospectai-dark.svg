<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">ProspectAI — Research-to-outreach workspace with explainable context.</title>
<desc id="desc">ProspectAI: websites, GitHub signals, notes and screenshots flow into an AI synthesis step that writes a tailored, explainable outreach message.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:Arial,Helvetica,'Liberation Sans',sans-serif}
.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:0 50%}
.fbt{transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes roll{from{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:-200}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}@keyframes ln0{0%,20%{transform:scaleX(0)}29%,90%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes ln1{0%,31%{transform:scaleX(0)}40%,90%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes ln2{0%,42%{transform:scaleX(0)}51%,90%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes ln3{0%,53%{transform:scaleX(0)}62%,90%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes ln4{0%,64%{transform:scaleX(0)}73%,90%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
@keyframes sent{0%,76%{opacity:0;transform:scale(.6)}80%,90%{opacity:1;transform:scale(1)}96%,100%{opacity:0}}
.hubring{transform-origin:316px 172px;animation:spin 10s linear infinite}</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="598" height="438" rx="26"/></clipPath>

</defs>
