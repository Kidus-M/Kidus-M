<g style="animation:sent 6s cubic-bezier(.16,1,.3,1) infinite" class="fb"><rect x="396" y="222" width="72" height="20" rx="10" fill="#D7FF3F"/><text x="432" y="236" class="mono" font-size="9" font-weight="700" letter-spacing="1.2" fill="#080808" text-anchor="middle">READY</text></g>
<text x="540" y="236" class="mono" font-size="8" letter-spacing="1" fill="#666666" fill-opacity="1" text-anchor="end" style="">4 SOURCES</text>
</g>
