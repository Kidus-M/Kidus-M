<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Operating range: discover, design, build, ship</title>
<desc id="desc">A four-stage engineering loop — discover, design, build, ship — with a signal travelling through each stage and looping back to discovery.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:Arial,Helvetica,'Liberation Sans',sans-serif}
.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:0 50%}
.fbt{transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes roll{from{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes travel{from{stroke-dashoffset:1000}to{stroke-dashoffset:-200}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}@keyframes lit0{0%,0%{opacity:0}4%,22%{opacity:1}30%,100%{opacity:0}}@keyframes lit1{0%,22%{opacity:0}26%,44%{opacity:1}52%,100%{opacity:0}}@keyframes lit2{0%,44%{opacity:0}48%,66%{opacity:1}74%,100%{opacity:0}}@keyframes lit3{0%,66%{opacity:0}70%,88%{opacity:1}96%,100%{opacity:0}}</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#0A0A0A" stroke-opacity="0.055"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="378" rx="26"/></clipPath>

</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="380" fill="#F4F1EA"/>
<rect width="1200" height="380" fill="url(#grid)"/>

<text x="48" y="50" class="mono" font-size="11" letter-spacing="2" fill="#5F7D00" fill-opacity="1" text-anchor="start" style="">OPERATING RANGE / 01—04</text>
<text x="48" y="88" class="sans" font-size="27" font-weight="700" fill="#0A0A0A" style="animation:rise 0.9s cubic-bezier(.16,1,.3,1) 0s backwards">From an unclear workflow to a system in production.</text>
<path d="M292 203H330M574 203H612M856 203H894" stroke="#5F7D00" stroke-width="1.5" stroke-dasharray="4 10" style="animation:dash 1s linear infinite"/>
<g transform="translate(48 128)"><g style="animation:rise 0.9s cubic-bezier(.16,1,.3,1) 0.2s backwards">
<rect width="244" height="150" rx="16" fill="#FAF8F3" stroke="#0A0A0A" stroke-opacity="0.12"/>
<rect x="-1" y="-1" width="246" height="152" rx="17" stroke="#5F7D00" stroke-width="2" style="animation:lit0 8s ease-in-out infinite;opacity:0"/>
<text x="20" y="31" class="mono" font-size="10" letter-spacing="1.5" fill="#5F7D00" fill-opacity="1">01 / DISCOVER</text>
<text x="20" y="66" class="sans" font-size="21" font-weight="700" fill="#0A0A0A">Find the real job.</text>
<text x="20" y="96" class="sans" font-size="13" fill="#57544F" fill-opacity="1">Domain · people · constraints</text>
<text x="20" y="119" class="sans" font-size="13" fill="#57544F" fill-opacity="1">Risks · success criteria</text>
</g></g><g transform="translate(330 128)"><g style="animation:rise 0.9s cubic-bezier(.16,1,.3,1) 0.3s backwards">
<rect width="244" height="150" rx="16" fill="#FAF8F3" stroke="#0A0A0A" stroke-opacity="0.12"/>
<rect x="-1" y="-1" width="246" height="152" rx="17" stroke="#5F7D00" stroke-width="2" style="animation:lit1 8s ease-in-out infinite;opacity:0"/>
<text x="20" y="31" class="mono" font-size="10" letter-spacing="1.5" fill="#5F7D00" fill-opacity="1">02 / DESIGN</text>
<text x="20" y="66" class="sans" font-size="21" font-weight="700" fill="#0A0A0A">Make it coherent.</text>
<text x="20" y="96" class="sans" font-size="13" fill="#57544F" fill-opacity="1">Experience · architecture</text>
<text x="20" y="119" class="sans" font-size="13" fill="#57544F" fill-opacity="1">Data · states · boundaries</text>
</g></g><g transform="translate(612 128)"><g style="animation:rise 0.9s cubic-bezier(.16,1,.3,1) 0.4s backwards">
<rect width="244" height="150" rx="16" fill="#FAF8F3" stroke="#0A0A0A" stroke-opacity="0.12"/>
<rect x="-1" y="-1" width="246" height="152" rx="17" stroke="#5F7D00" stroke-width="2" style="animation:lit2 8s ease-in-out infinite;opacity:0"/>
<text x="20" y="31" class="mono" font-size="10" letter-spacing="1.5" fill="#5F7D00" fill-opacity="1">03 / BUILD</text>
<text x="20" y="66" class="sans" font-size="21" font-weight="700" fill="#0A0A0A">Connect the layers.</text>
<text x="20" y="96" class="sans" font-size="13" fill="#57544F" fill-opacity="1">Web · mobile · APIs</text>
<text x="20" y="119" class="sans" font-size="13" fill="#57544F" fill-opacity="1">Auth · data · integrations</text>
</g></g><g transform="translate(894 128)"><g style="animation:rise 0.9s cubic-bezier(.16,1,.3,1) 0.6s backwards">
<rect width="258" height="150" rx="16" fill="#D7FF3F" stroke="#0A0A0A" stroke-opacity="0"/>
<rect x="-1" y="-1" width="260" height="152" rx="17" stroke="#0A0A0A" stroke-width="2" style="animation:lit3 8s ease-in-out infinite;opacity:0"/>
<text x="20" y="31" class="mono" font-size="10" letter-spacing="1.5" fill="#080808" fill-opacity="0.66">04 / SHIP</text>
<text x="20" y="66" class="sans" font-size="21" font-weight="800" fill="#080808">Own the outcome.</text>
<text x="20" y="96" class="sans" font-size="13" fill="#080808" fill-opacity="0.7">Test · deploy · observe</text>
<text x="20" y="119" class="sans" font-size="13" fill="#080808" fill-opacity="0.7">Learn · refine · maintain</text>
</g></g>
<path d="M1023 278C1023 330 990 334 940 334H220C170 334 170 330 170 278" stroke="#5F7D00" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 10" style="animation:dash 1.4s linear infinite"/>
<path d="M164 290L170 278L176 290" stroke="#5F7D00" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle r="4" fill="#5F7D00" class="motion"><animateMotion dur="8s" repeatCount="indefinite" path="M170 203H1023" keyPoints="0;0;0.33;0.33;0.67;0.67;1;1" keyTimes="0;0.12;0.22;0.34;0.44;0.56;0.66;1" calcMode="linear"/></circle>
<rect x="470" y="322" width="260" height="24" rx="12" fill="#F4F1EA" stroke="#0A0A0A" stroke-opacity="0.12"/>
<text x="600" y="338" class="mono" font-size="10" letter-spacing="1.6" fill="#5F7D00" fill-opacity="1" text-anchor="middle" style="">LEARN · REFINE · REPEAT</text>
<text x="1152" y="50" class="mono" font-size="10" letter-spacing="1.4" fill="#9C978D" fill-opacity="1" text-anchor="end" style="">A CONTINUUM, NOT A HANDOFF</text>
</g>
<rect x="1" y="1" width="1198" height="378" rx="26" stroke="#0A0A0A" stroke-opacity="0.13999999999999999" stroke-width="2"/>
</svg>
