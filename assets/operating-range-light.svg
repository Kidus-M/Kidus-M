<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kidus Mesfin's operating range</title>
  <desc id="desc">A four-stage engineering process: discover, design, build, and ship.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#0A0A0A" stroke-opacity=".04"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#719100"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="#F4F1EA" stroke="#0A0A0A" stroke-opacity=".16" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#grid)"/>
  <text x="48" y="50" fill="#5E7900" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">OPERATING RANGE / 01—04</text>
  <text x="48" y="87" fill="#0A0A0A" font-family="Arial,sans-serif" font-size="27" font-weight="700">From an unclear workflow to a system in production.</text>
  <path d="M292 202H336M574 202H618M856 202H900" stroke="#719100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g transform="translate(48 128)">
    <rect width="244" height="150" rx="16" fill="#FAF8F3" stroke="#0A0A0A" stroke-opacity=".1"/>
    <text x="20" y="31" fill="#5E7900" font-family="ui-monospace,Menlo,monospace" font-size="10" letter-spacing="1.5">01 / DISCOVER</text>
    <text x="20" y="66" fill="#0A0A0A" font-family="Arial,sans-serif" font-size="21" font-weight="700">Find the real job.</text>
    <text x="20" y="96" fill="#595959" font-family="Arial,sans-serif" font-size="13">Domain · people · constraints</text>
    <text x="20" y="119" fill="#595959" font-family="Arial,sans-serif" font-size="13">Risks · success criteria</text>
  </g>
  <g transform="translate(330 128)">
    <rect width="244" height="150" rx="16" fill="#FAF8F3" stroke="#0A0A0A" stroke-opacity=".1"/>
    <text x="20" y="31" fill="#5E7900" font-family="ui-monospace,Menlo,monospace" font-size="10" letter-spacing="1.5">02 / DESIGN</text>
    <text x="20" y="66" fill="#0A0A0A" font-family="Arial,sans-serif" font-size="21" font-weight="700">Make it coherent.</text>
    <text x="20" y="96" fill="#595959" font-family="Arial,sans-serif" font-size="13">Experience · architecture</text>
    <text x="20" y="119" fill="#595959" font-family="Arial,sans-serif" font-size="13">Data · states · boundaries</text>
  </g>
  <g transform="translate(612 128)">
    <rect width="244" height="150" rx="16" fill="#FAF8F3" stroke="#0A0A0A" stroke-opacity=".1"/>
    <text x="20" y="31" fill="#5E7900" font-family="ui-monospace,Menlo,monospace" font-size="10" letter-spacing="1.5">03 / BUILD</text>
    <text x="20" y="66" fill="#0A0A0A" font-family="Arial,sans-serif" font-size="21" font-weight="700">Connect the layers.</text>
    <text x="20" y="96" fill="#595959" font-family="Arial,sans-serif" font-size="13">Web · mobile · APIs</text>
    <text x="20" y="119" fill="#595959" font-family="Arial,sans-serif" font-size="13">Auth · data · integrations</text>
  </g>
  <g transform="translate(894 128)">
    <rect width="258" height="150" rx="16" fill="#A7D600"/>
    <text x="20" y="31" fill="#0A0A0A" fill-opacity=".65" font-family="ui-monospace,Menlo,monospace" font-size="10" letter-spacing="1.5">04 / SHIP</text>
    <text x="20" y="66" fill="#0A0A0A" font-family="Arial,sans-serif" font-size="21" font-weight="800">Own the outcome.</text>
    <text x="20" y="96" fill="#0A0A0A" fill-opacity=".68" font-family="Arial,sans-serif" font-size="13">Test · deploy · observe</text>
    <text x="20" y="119" fill="#0A0A0A" fill-opacity=".68" font-family="Arial,sans-serif" font-size="13">Learn · refine · maintain</text>
  </g>
  <text x="48" y="313" fill="#77736A" font-family="ui-monospace,Menlo,monospace" font-size="10" letter-spacing="1.3">PRODUCT ENGINEERING IS A CONTINUUM, NOT A HANDOFF.</text>
</svg>
